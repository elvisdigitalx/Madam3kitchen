<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon: Modern Cooking Pot / Cloche with 3 flame sparks and Number 3 -->
  <g transform="translate(10, 10)">
    <!-- Outer Badge circle -->
    <circle cx="40" cy="40" r="38" fill="#2E1A11" stroke="url(#gradBrand)" stroke-width="2.5" />
    <circle cx="40" cy="40" r="33" fill="none" stroke="#FFB300" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    
    <!-- Steam / Flavors -->
    <path d="M 30 24 C 30 18, 35 16, 33 11" fill="none" stroke="url(#gradGold)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 40 22 C 40 15, 45 13, 43 8" fill="none" stroke="url(#gradBrand)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 50 24 C 50 18, 55 16, 53 11" fill="none" stroke="url(#gradGold)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cooking Pot Base -->
    <path d="M 22 42 L 58 42 C 58 56, 50 63, 40 63 C 30 63, 22 56, 22 42 Z" fill="url(#gradBrand)" />
    <!-- Pot handles -->
    <path d="M 18 45 C 15 45, 15 51, 22 51" fill="none" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 62 45 C 65 45, 65 51, 58 51" fill="none" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lid rim -->
    <rect x="20" y="38" width="40" height="5" rx="2.5" fill="#FFB300" />
    <!-- Number 3 in center of pot -->
    <text x="40" y="55" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">3</text>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- MADAM 3 -->
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="30" fill="#2E1A11" letter-spacing="0.5">
      MADAM <tspan fill="url(#gradBrand)">3</tspan>
    </text>
    
    <!-- KITCHEN -->
    <text x="145" y="32" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="30" fill="#D84315" letter-spacing="1">
      KITCHEN
    </text>

    <!-- Subtitle: Authentic Nigerian Cuisine • Benin City -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10.5" fill="#795548" letter-spacing="1.8">
      AUTHENTIC NIGERIAN CUISINE • BENIN CITY
    </text>

    <!-- Rating stars / Edo vibe accent line -->
    <line x1="2" y1="58" x2="300" y2="58" stroke="url(#gradGold)" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
